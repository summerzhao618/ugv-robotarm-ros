ekf_localization:
  ros__parameters:
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    two_d_mode: true

    frequency: 50.0

    # Odometry from differential drive controller
    odom0: diff_drive_controller/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, true,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # IMU data
    imu0: imu/data
