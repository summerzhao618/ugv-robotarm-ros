controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Controllers list
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: forward_command_controller/ForwardCommandController

    # Gripper individual joint controllers (for direct control)
    rh_p12_rn_controller:
      type: effort_controllers/JointEffortController

    rh_r2_controller:
      type: effort_controllers/JointEffortController

    rh_l1_controller:
      type: effort_controllers/JointEffortController

    rh_l2_controller:
      type: effort_controllers/JointEffortController


# Joint State Broadcaster - publishes joint states
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50


# Differential Drive Controller - mobile base
diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["front_left_wheel", "rear_left_wheel"]
    right_wheel_names: ["front_right_wheel", "rear_right_wheel"]

    wheel_separation: 0.5708
    wheel_radius: 0.1651

    wheel_separation_multiplier: 1.875
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]

    open_loop: false
    enable_odom_tf: false  # robot_localization publishes odom->base_link

    cmd_vel_timeout: 0.5
    #publish_limited_velocity: true
    use_stamped_vel: false
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 3.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 6.0
    angular.z.min_acceleration: -6.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0


# UR3 Arm Controller
arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 25.0
    action_monitor_rate: 10.0

    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.6
      shoulder_pan_joint: {trajectory: 0.1, goal: 0.1}
      shoulder_lift_joint: {trajectory: 0.1, goal: 0.1}
      elbow_joint: {trajectory: 0.1, goal: 0.1}
      wrist_1_joint: {trajectory: 0.1, goal: 0.1}
      wrist_2_joint: {trajectory: 0.1, goal: 0.1}
      wrist_3_joint: {trajectory: 0.1, goal: 0.1}


# Gripper controllers (effort-based with PID)
rh_p12_rn_controller:
  ros__parameters:
    joint: rh_p12_rn
    pid: {p: 7000.0, i: 0.1, d: 300.0}

rh_r2_controller:
  ros__parameters:
    joint: rh_r2
    pid: {p: 7000.0, i: 0.1, d: 300.0}

rh_l1_controller:
  ros__parameters:
    joint: rh_l1
    pid: {p: 7000.0, i: 0.1, d: 300.0}

rh_l2_controller:
  ros__parameters:
    joint: rh_l2
    pid: {p: 7000.0, i: 0.1, d: 300.0}
